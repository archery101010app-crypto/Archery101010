apply plugin: 'com.android.application'

def keystorePropsFile = file("../keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "com.archery101010.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.archery101010.app"
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Wear OS form-factor versionCode offset (+100000 over mobile versionCode)
        versionCode 152100
        versionName "2.121"
    }

    signingConfigs {
        release {
            def ksPath = keystoreProps.getProperty("storeFile") ?: System.getenv("ARCHERY_KEYSTORE_PATH")
            def ksPass = keystoreProps.getProperty("storePassword") ?: System.getenv("ARCHERY_KEYSTORE_PASSWORD")
            def ksAlias = keystoreProps.getProperty("keyAlias") ?: System.getenv("ARCHERY_KEY_ALIAS")
            def ksKeyPass = keystoreProps.getProperty("keyPassword") ?: System.getenv("ARCHERY_KEY_PASSWORD")
            if (ksPath) {
                def resolvedKsFile = file(ksPath).exists() ? file(ksPath) : rootProject.file(ksPath)
                if (resolvedKsFile.exists() && ksPass && ksAlias && ksKeyPass) {
                    storeFile resolvedKsFile
                    storePassword ksPass
                    keyAlias ksAlias
                    keyPassword ksKeyPass
                }
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "com.google.android.gms:play-services-wearable:19.0.0"
}
