apply plugin: 'com.android.application'

def keystorePropsFile = file("../keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "com.archery101010.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.archery101010.app"
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Wear OS form-factor versionCode offset (+100000 over mobile versionCode)
        versionCode 157200
        versionName "2.172"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("ARCHERY_KEYSTORE_FILE") ?: System.getenv("ARCHERY_KEYSTORE_PATH") ?: keystoreProps.getProperty("storeFile")
            def ksPass = System.getenv("ARCHERY_KEYSTORE_PASSWORD") ?: keystoreProps.getProperty("storePassword")
            def ksAlias = System.getenv("ARCHERY_KEY_ALIAS") ?: keystoreProps.getProperty("keyAlias")
            def ksKeyPass = System.getenv("ARCHERY_KEY_PASSWORD") ?: keystoreProps.getProperty("keyPassword")
            if (ksPath) {
                def directKsFile = new File(ksPath)
                def resolvedKsFile = directKsFile.isAbsolute() ? directKsFile : (file(ksPath).exists() ? file(ksPath) : rootProject.file(ksPath))
                if (resolvedKsFile.exists() && ksPass && ksAlias && ksKeyPass) {
                    storeFile resolvedKsFile
                    storePassword ksPass
                    keyAlias ksAlias
                    keyPassword ksKeyPass
                }
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "com.google.android.gms:play-services-wearable:19.0.0"
    implementation "androidx.health:health-services-client:1.1.0"
    implementation "com.google.guava:guava:31.1-android"
}
