apply plugin: 'com.android.application'

def keystorePropsFile = file("../keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "com.archery101010.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.archery101010.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 53200
        versionName "2.132"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.apk:!*.aab:!*.zip'
        }
    }
    signingConfigs {
        release {
            def ksPath = keystoreProps.getProperty("storeFile") ?: System.getenv("ARCHERY_KEYSTORE_PATH")
            def ksPass = keystoreProps.getProperty("storePassword") ?: System.getenv("ARCHERY_KEYSTORE_PASSWORD")
            def ksAlias = keystoreProps.getProperty("keyAlias") ?: System.getenv("ARCHERY_KEY_ALIAS")
            def ksKeyPass = keystoreProps.getProperty("keyPassword") ?: System.getenv("ARCHERY_KEY_PASSWORD")
            if (ksPath) {
                def resolvedKsFile = file(ksPath).exists() ? file(ksPath) : rootProject.file(ksPath)
                if (resolvedKsFile.exists() && ksPass && ksAlias && ksKeyPass) {
                    storeFile resolvedKsFile
                    storePassword ksPass
                    keyAlias ksAlias
                    keyPassword ksKeyPass
                }
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.google.android.gms:play-services-auth:21.2.0"
    implementation "com.google.android.gms:play-services-wearable:19.0.0"
    // Opens the Play Store listing directly on the paired Wear OS watch ("Instalar en reloj")
    implementation "androidx.wear:wear-remote-interactions:1.1.0"
    // Official Spotify App Remote SDK (libs/spotify-app-remote-release-0.8.0.aar) + its JSON dependency
    implementation(name: 'spotify-app-remote-release-0.8.0', ext: 'aar')
    implementation "com.google.code.gson:gson:2.10.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
