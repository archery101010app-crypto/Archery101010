name: Build Garmin Connect IQ (.iq)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iq:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install connect-iq-sdk-manager-cli
        run: |
          LATEST_URL=$(curl -s https://api.github.com/repos/lindell/connect-iq-sdk-manager-cli/releases/latest | grep "browser_download_url.*linux_x86_64.tar.gz" | cut -d '"' -f 4)
          curl -sL "$LATEST_URL" -o ciq-cli.tar.gz
          tar -xzf ciq-cli.tar.gz connect-iq-sdk-manager
          chmod +x connect-iq-sdk-manager
          sudo mv connect-iq-sdk-manager /usr/local/bin/

      - name: Authenticate Garmin SDK & Download Devices
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          if [ -z "$GARMIN_USERNAME" ] || [ -z "$GARMIN_PASSWORD" ]; then
            echo "::error::Faltan los secretos GARMIN_USERNAME y GARMIN_PASSWORD en Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          connect-iq-sdk-manager agreement view >/dev/null
          connect-iq-sdk-manager agreement accept
          connect-iq-sdk-manager login
          connect-iq-sdk-manager sdk set ^8.0.0 || connect-iq-sdk-manager sdk set ^7.0.0
          connect-iq-sdk-manager device download --include-fonts --manifest=garmin-ciq/manifest.xml

      - name: Generate or Load 4096-bit RSA Developer Key
        env:
          GARMIN_DEVELOPER_KEY_B64: ${{ secrets.GARMIN_DEVELOPER_KEY_B64 }}
        run: |
          if [ -n "$GARMIN_DEVELOPER_KEY_B64" ]; then
            echo "$GARMIN_DEVELOPER_KEY_B64" | base64 -d > developer_key.der
          else
            openssl genrsa -out developer_key.pem 4096
            openssl pkcs8 -topk8 -inform PEM -outform DER -in developer_key.pem -out developer_key.der -nocrypt
          fi

      - name: Compile Signed Archery101010.iq Package
        run: |
          export PATH="$(connect-iq-sdk-manager sdk current-path --bin):$PATH"
          monkeyc -e -w -r \
            -f garmin-ciq/monkey.jungle \
            -y developer_key.der \
            -o public/Archery101010.iq
          ls -lh public/Archery101010.iq

      - name: Upload Archery101010.iq Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Archery101010-Garmin-IQ
          path: public/Archery101010.iq
          if-no-files-found: error

      - name: Save Archery101010.iq to Repository public/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/Archery101010.iq
          git commit -m "chore(garmin): publish compiled Archery101010.iq package" || echo "No changes"
          git push origin HEAD:main
